name: Build Multitool MargyT plugin

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UltPlug
        uses: actions/checkout@v4
      - name: Checkout MargyT toolchain
        uses: actions/checkout@v4
        with:
          repository: narezany/MargyT
          path: MargyT
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Multitool .mtp
        shell: bash
        run: |
          set -e
          rm -rf MargyT/examples/multitool
          mkdir -p MargyT/examples/multitool/java/cat/cuuw619/faklikes
          cp manifest.json MargyT/examples/multitool/manifest.json
          cp java/cat/cuuw619/faklikes/FakeLikes.java MargyT/examples/multitool/java/cat/cuuw619/faklikes/FakeLikes.java

          # Apply deterministic source fixes before javac. The plugin API does not
          # provide a custom set(TextView, String) helper.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MargyT/examples/multitool/java/cat/cuuw619/faklikes/FakeLikes.java')
          s = p.read_text()
          s = s.replace('set(t,target);', 't.setText(target);')
          s = s.replace('set(t,fmt((Integer)x.getAnimatedValue()));', 't.setText(fmt((Integer)x.getAnimatedValue()));')
          s = s.replace('''    private boolean isCommentScreen(Activity a,View root){String n=a.getClass().getName().toLowerCase(Locale.US);if(n.contains("detail")||n.contains("comment"))return true;return hasCommentComposer(root);}\n    private boolean hasCommentComposer(View root){ArrayList<TextView> ts=new ArrayList<TextView>();collectText(root,ts);for(TextView t:ts){String s=String.valueOf(t.getHint())+" "+String.valueOf(t.getContentDescription())+" "+String.valueOf(t.getText());s=s.toLowerCase(Locale.US);if(s.contains("add comment")||s.contains("comment")||s.contains("комментар")||s.contains("коментар"))return true;}return false;}''', '''    private boolean isCommentScreen(Activity a,View root){String n=a.getClass().getName().toLowerCase(Locale.US);if(n.contains("detail")||n.contains("comment"))return true;return hasCommentComposer(root);}\n    private boolean hasCommentComposer(View root){if(!(root instanceof ViewGroup))return false;ArrayList<View> inputs=new ArrayList<View>();collectInputs(root,inputs);for(View v:inputs){String s=String.valueOf(v.getContentDescription())+" "+String.valueOf(v instanceof TextView?((TextView)v).getHint():"")+" "+String.valueOf(v instanceof TextView?((TextView)v).getText():"");s=s.toLowerCase(Locale.US);if((s.contains("comment")||s.contains("комментар")||s.contains("коментар")||s.contains("add a comment"))&&v.isShown()&&v.isEnabled())return true;}return false;}\n    private void collectInputs(View v,ArrayList<View> out){if(!v.isShown())return;if(v instanceof EditText)out.add(v);if(v instanceof ViewGroup){ViewGroup g=(ViewGroup)v;for(int i=0;i<g.getChildCount();i++)collectInputs(g.getChildAt(i),out);}}''')
          p.write_text(s)
          if 'set(t,' in s:
              raise SystemExit('Unpatched set(t,...) remains')
          print('Multitool source patched for build')
          PY

          cd MargyT
          python3 -m margyt.plugin examples/multitool
          test -f examples/multitool/margyt.multitool.mtp
          unzip -l examples/multitool/margyt.multitool.mtp
      - name: Upload Multitool 0.0.6
        uses: actions/upload-artifact@v4
        with:
          name: Multitool-0.0.6
          path: MargyT/examples/multitool/margyt.multitool.mtp
          if-no-files-found: error
